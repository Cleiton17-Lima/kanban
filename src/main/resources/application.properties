spring.application.name=kanban

# MySQL: configure DB_URL, DB_USERNAME e DB_PASSWORD no ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Em desenvolvimento, update preserva as tabelas existentes.
# Para producao, prefira migracoes versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Sessões e respostas de erro seguras
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
