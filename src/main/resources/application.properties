spring.application.name=kanban

# MySQL: configure DB_URL, DB_USERNAME e DB_PASSWORD no ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Em desenvolvimento, update preserva as tabelas existentes.
# Para producao, prefira migracoes versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
