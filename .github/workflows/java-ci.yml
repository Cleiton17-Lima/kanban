name: Java CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: kanban_db
          MYSQL_USER: kanban
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ukanban -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/kanban_db?useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: kanban
          DB_PASSWORD: test-password
          DDL_AUTO: update
          COOKIE_SECURE: false
        run: mvn --batch-mode --no-transfer-progress verify
